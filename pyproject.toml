[project]
name = "dino-autofocus"
version = "0.0.1"
description = "Frozen DINOv2 features for microscope autofocus (focus score / signed z-error)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
    "torch>=2.6",
    "torchvision>=0.21",
    "pymmcore-plus==0.18.1",
    "pymmcore==12.5.0.75.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
web = [
    "nodejs-wheel>=22,<23",
]

[tool.uv]
# `uv sync` installs Node (web group) too, so the React build needs no system Node.
default-groups = ["dev", "web"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dino_autofocus"]

[tool.ruff]
line-length = 100
# vendored from psf-autofocus; kept in its upstream style so the two stay diffable
extend-exclude = [
    "src/dino_autofocus/synth",
    "tests/synth",
    "scripts/make_dataset.py",
    "scripts/show_system.py",
    "scripts/preview_dataset.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
